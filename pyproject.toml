[project]
name = "moroccowater"
version = "0.1.0"
description = "Morocco drought and water security from satellite data"
requires-python = ">=3.11"
dependencies = [
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3.10",
    "xarray>=2024.3",
    "dask[distributed]>=2024.3",
    "rioxarray>=0.15",
    "geopandas>=1.0",
    "shapely>=2.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyarrow>=26.0.0",
    "scipy>=1.17.1",
    "zarr>=3.1.6",
    "adlfs>=2026.8.0",
    "fsspec>=2026.9.0",
    "pysheds>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moroccowater"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
